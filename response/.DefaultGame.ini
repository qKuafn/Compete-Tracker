+TextReplacements=(Category=Game, Namespace="", Key="EA9EFFCD47A1684CD52FEF94F0591C5D", NativeString="<text fontface=\"75 Medium\">Storm Uzi's stronghold with new weapons and Sprites</>\r\nItâs time for a little chaos. Lil Uzi and Cuddle Team Leader have claimed a fort of their own, while Buggy and the Megalodon crash onto the island looking for trouble. New weapons, strange new Sprites, and plenty of firepower for the hunt.", LocalizedStrings=(("ar","<text fontface=\"75 Medium\">Ű§ÙŰȘŰ­Ù Ű­Ű”Ù Uzi ŰšŰŁŰłÙŰ­Ű© ÙŰŁŰ±ÙŰ§Ű­ ŰŹŰŻÙŰŻŰ©</>\r\nŰ­Ű§Ù ÙÙŰȘ Ű§ÙÙÙÙÙ ÙÙ Ű§ÙÙÙŰ¶Ù. Ű§ŰłŰȘÙÙÙ Lil Uzi ÙÙŰ§ŰŠŰŻŰ© ÙŰ±ÙÙ Ű§ÙŰčÙŰ§Ù ŰčÙÙ Ű­Ű”Ù ŰźŰ§Ű” ŰšÙÙŰ§Ű ŰšÙÙÙŰ§ ÙŰ”Ù ŰšŰ§ŰșÙ Ű„ÙÙ Ű§ÙŰŹŰČÙŰ±Ű© ŰšŰ­Ű«ÙŰ§ ŰčÙ Ű§ÙÙŰȘŰ§ŰčŰš. ŰŁŰłÙŰ­Ű© ŰŹŰŻÙŰŻŰ© ÙŰŁŰ±ÙŰ§Ű­ ŰșŰ±ÙŰšŰ© ŰŹŰŻÙŰŻŰ© ÙÙÙŰ© ÙŰ§Ű±ÙŰ© ÙÙÙŰ±Ű© ÙÙ ŰŁŰŹÙ Ű§ÙÙŰșŰ§ÙŰ±Ű©."),("en","<text fontface=\"75 Medium\">Storm Uzi's stronghold with new weapons and Sprites</>\r\nIt's time for a little chaos. Lil Uzi and Cuddle Team Leader have claimed a fort of their own, while Buggy has arrived on the island looking for trouble. New weapons, strange new Sprites, and plenty of firepower for the hunt."),("de","<text fontface=\"75 Medium\">StĂŒrme Uzis Festung mit neuen Waffen und Geistern</>\r\nEs wird Zeit fĂŒr ein bisschen Chaos. Lil Uzi und die Kuschelbeauftragte haben ein eigenes Fort besetzt, wĂ€hrend Buggy auf der Insel eingetroffen ist und Ărger sucht. Neue Waffen, seltsame neue Geister und jede Menge Feuerkraft fĂŒr die Jagd."),("es","<text fontface=\"75 Medium\">Asalta la Fortaleza de Uzi con nuevas armas y espĂ­ritus</>\r\nEs hora de desatar el caos. Lil Uzi y la LĂ­der del equipo arrumacos se han apoderado de un fuerte, mientras que Buggy ha llegado a la isla con ganas de dar problemas. Nuevas armas, nuevos y extraĂ±os espĂ­ritus y mucha potencia de fuego para la caza."),("es-419","<text fontface=\"75 Medium\">Asalta la Fortaleza de Uzi con nuevas armas y espĂ­ritus</>\r\nÂĄHora de causar un poco de caos! Lil Uzi y LĂ­der del equipo cariĂ±oso se apoderaron de un fuerte, mientras que Buggy llegĂł a la isla buscando problemas. Nuevas armas, espĂ­ritus extraĂ±os y un arsenal de artillerĂ­a pesada para la caza."),("fr","<text fontface=\"75 Medium\">Prenez d'assaut la Forteresse d'Uzi avec de nouvelles armes et de nouveaux esprits</>\r\nL'heure est au chaos. Lil Uzi et l'Experte des cĂąlins ont pris le contrĂŽle d'un fort, tandis que Baggy est arrivĂ© sur l'Ăźle, bien dĂ©cidĂ© Ă  en dĂ©coudre. De nouvelles armes, de nouveaux esprits Ă©tranges et des armes Ă  feu dignes d'une chasse."),("id","<text fontface=\"75 Medium\">Serbu markas Uzi yang kuat dengan senjata dan Sprite baru</>\r\nSaatnya sedikit kekacauan. Lil Uzi dan Pemimpin Tim Peluk sudah menguasai benteng mereka sendiri, sementara Buggy telah tiba di pulau untuk mencari masalah. Senjata baru, Sprite baru yang aneh, dan banyak daya tempur untuk perburuan."),("it","<text fontface=\"75 Medium\">Assalta la fortezza di Uzi con nuove armi e nuovi spiritelli</>\r\nĂ ora di un po' di caos. Lil Uzi e la Leader della Squadra delle Coccole hanno conquistato il loro forte, mentre Bagy Ăš arrivato sull'isola in cerca di guai. Nuove armi, nuovi spiritelli bizzarri e una potenza di fuoco pazzesca per la caccia."),("ja","<text fontface=\"75 Medium\">æ°ăăæ­ŠćšăšçČŸéăšăšăă«Lil' Uzi ăčăă­ăłă°ăăŒă«ăă«çȘæ</>\r\năăăă«ăȘăčăć·»ăè”·ăăăăLil UziăšăăłăŻăźăŻăăĄăăăèȘćăźç Šăçąșäżăăäžæčă§ăăăźăŒăçœăăăăăăăăšćł¶ă«äčăèŸŒăă§ăăăæ°ăăæ­Šćšăć€ăăŁăæ°ăăȘçČŸéăăăăŠç©ăăźăăăźććăȘç«ćă"),("ko","<text fontface=\"75 Medium\">ìëĄìŽ ëŹŽêž°ì ì ë čìŒëĄ ì°ì§ì ììë„Œ ì”êČ©íìž</>\r\níŒëì ìą ìŒìŒíŹ ìê°ìëë€. ëŠŽ ì°ì§ì íŹìčí ëŠŹëê° ììë„Œ ì°šì§íêł , ëČêž°ê° ìŹì ë€ìŽë„ìł ìëì ìŒìŒí”ëë€. ìëĄìŽ ëŹŽêž