m/ratings-guide-generic"),("es","Establece la calificaciĂłn de contenido para todos los dispositivos en los que se utilice esta cuenta. Es necesario introducir la contraseĂ±a para desbloquear las experiencias con una calificaciĂłn superior a la seleccionada.\n\n<strong>16+:</> apto para mayores de 16 aĂ±os.\n\n<strong>12+:</> puede contener violencia hacia personajes fantĂĄsticos o violencia no realista hacia personajes humanos o animales. Puede incluir desnudez no grĂĄfica y lenguaje moderado, y se permite la simulaciĂłn de juegos de azar, pero no los comentarios sexistas.\n\n<strong>7+:</> puede contener escenas o sonidos que asusten a niĂ±os pequeĂ±os y de violencia implĂ­cita, no detallada y no realista.\n\n<strong>3+:</> apto para todas las edades. Puede incluir violencia menor en contextos cĂłmicos o fantĂĄsticos. No se permite el lenguaje soez.\n\nMĂĄs informaciĂłn sobre las calificaciones en https://www.globalratings.com/ratings-guide-generic (en inglĂ©s)"),("es-419","Establece la clasificaciĂłn de contenido para todos los dispositivos que usan esta cuenta. Se requerirĂĄ un PIN para desbloquear las experiencias con una clasificaciĂłn mĂĄs alta que la seleccionada.\n\n<strong>16+</>: Apto para mayores de 16 aĂ±os.\n\n<strong>12+</>: EstĂĄ permitida la violencia que involucra a personajes de fantasĂ­a o la violencia no grĂĄfica que involucra a personajes de apariencia humana o animales. TambiĂ©n se permiten la desnudez no grĂĄfica, el lenguaje moderado y las apuestas simuladas, pero no estĂĄ permitido el uso de comentarios o improperios sexuales.\n\n<strong>7+</>: Puede contener escenas o sonidos que atemorizan a los niĂ±os. EstĂĄ permitida la violencia moderada (implĂ­cita o no realista).\n\n<strong>3+</>: Apto para todas las edades. Se acepta la violencia en contextos cĂłmicos o de fantasĂ­a. No estĂĄ permitido el uso de lenguaje soez.\n\nMĂĄs informaciĂłn sobre las clasificaciones: https://www.globalratings.com/ratings-guide-generic"),("fr","DĂ©finissez la 