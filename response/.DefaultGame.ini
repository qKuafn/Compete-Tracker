+TextReplacements=(Category=Game, Namespace="", bIsMinimalPatch=True, Key="B0DF413E445BAC5FB24E649CA525F319", NativeString="Plunder the Fortnite Item Shop - twice! Activate the Pirate Shop once in 2026 and once in 2027. Each time, you can claim anything sold for V-Bucks in the Fortnite Item Shop for free for 14 days from activation. Real money offers, gifting and passes levels/rewards are excluded, and you can only claim one free sidekick you do not already own. This treasure is not transferable.\r\n\r\nProtect your plunder! Learn more about how to enable two-factor authentication (if you haven't done so already) and keep your account secure at: fn.gg/2FA", LocalizedStrings=(("de","PlĂŒndere den Fortnite Item-Shop â zweimal! Aktiviere den Piraten-Shop einmal 2026 und einmal 2027. Nach jeder Aktivierung kannst du 14 Tage lang alles, was im Fortnite Item-Shop V-Bucks kostet, kostenlos einlĂ¶sen. Angebote fĂŒr echtes Geld, Verschenken sowie Pass-Level/-Belohnungen sind ausgeschlossen. Du kannst nur einen kostenlosen Begleiter einfordern, den du noch nicht besitzt. Der Schatz ist nicht ĂŒbertragbar.\r\n\r\nSchĂŒtze deine Beute! Erfahre, wie du die Zwei-Faktor-Authentifizierung aktivierst und dein Konto schĂŒtzt: fn.gg/2FA"),("es","Saquea la tienda de objetos de Fortnite... ÂĄdos veces! Activa la tienda pirata una vez en 2026 y otra en 2027. Durante 14 dĂ­as desde cada activaciĂłn, puedes reclamar gratis cualquier cosa a la venta por PaVos en la tienda de objetos de Fortnite. Se excluyen las ofertas con dinero real, los regalos y los niveles o recompensas del pase; solo puedes obtener un compaĂ±ero gratis que aĂșn no tengas. Este tesoro no es transferible.\r\n\r\nÂĄProtege tu botĂ­n! ObtĂ©n mĂĄs informaciĂłn sobre cĂłmo habilitar la autenticaciĂłn en dos pasos (si no lo has hecho ya) y mantener tu cuenta segura en: fn.gg/2FA"),("es-419","Saquea la tienda de objetos de Fortnite, ÂĄdos veces! Activa la Tienda pirata una vez en 2026 y otra en 2027. Cada vez, puedes reclamar gratis por 14 dĂ­as desde la activaciĂłn cualquier cosa vendida por monedas V en la tienda de objetos de Fortnite. Se excluyen ofertas con dinero real, regalos y niveles o recompensas del pase, y solo puedes reclamar un compaĂ±ero gratis que aĂșn no tengas. Este tesoro no es transferible.\r\n\r\nÂĄProtege tu botĂ­n! CĂłmo habilitar la A2F (si aĂșn no lo hiciste) y mantener tu cuenta segura en: fn.gg/2FA"),("fr","Pillez la boutique Fortnite deux fois ! Activez la boutique pirate une fois en 2026 et une fois en 2027 pour rĂ©cupĂ©rer gratuitement, pendant 14 jours Ă  chaque activation, tous les objets achetables avec des V-bucks (hors offres en argent rĂ©el, cadeaux et rĂ©compenses de passe). Une seule mascotte gratuite non possĂ©dĂ©e est autorisĂ©e. Butin non transfĂ©rable.\r\n\r\nProtĂ©gez votre butin ! Activez la 2FA et sĂ©curisez votre compte sur fn.gg/2FA."),("it","Saccheggia il Negozio oggetti di Fortnite due volte! Attiva il Negozio dei pirati sia nel 2026 sia nel 2027. Potrai riscattare gratuitamente per 14 giorni dall'attivazione qualsiasi oggetto acquistabile con V-buck presente nel Negozio. Sono escluse le offerte in denaro reale, i regali e i livelli/le ricompense del pass. Potrai riscattare solo una mascotte gratuita che non possiedi. Il tesoro non Ăš trasferibile.\r\n\r\nProteggi il tuo bottino! Scopri come abilitare l'autenticazione a due fattori e mantenere il tuo account al sicuro su: fn.gg/2FA"),("pl","SplÄdruj Sklep z przedmiotami Fortnite â dwa razy! Aktywuj piracki sklep w 2026 i w 2027 roku. Za kaĆŒdym razem przez 14 dni odbieraj darmowe przedmioty za V-dolce w sklepie z przedmiotami Fortnite. Nie dotyczy zakupĂłw za gotĂłwkÄ, prezentĂłw ani nagrĂłd i poziomĂłw karnetĂłw. Tylko jeden nowy druh. Ten skarb nie podlega przeniesieniu.\r\n\r\nChroĆ swĂłj Ćup! Dowiedz siÄ, jak wĆÄczyÄ logowanie dwuetapowe (jeĆli jeszcze tego nie zrobiono), by zabezpieczyÄ konto: fn.gg/2FA"),("ru","ĐĐČĐ°Đ¶ĐŽŃ ĐŸĐłŃĐ°Đ±ŃŃĐ” ĐŒĐ°ĐłĐ°Đ·ĐžĐœ ĐżŃĐ”ĐŽĐŒĐ”Ń